# build.yml 定时多架构打包发布 ghcr.io + 双架构离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 参考 /tmp/wb2api-build，适配本仓库（workflow 就住在仓库里，无需双 checkout 覆盖 Dockerfile）。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:23 = UTC 04:23。
    # 不用整点 04:00：GitHub schedule 在整点高峰排队严重（实测连续三天迟到 5h+，
    # 2026-09-17 的 04:00 排队被静默丢弃、整天未跑），错峰 23 分降低排队延迟与丢弃率。
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 触发发布：镜像 + 离线包 + GitHub Release（见 release 任务）

# 定时 / 手动 / tag 可能撞车：同组串行，但不取消进行中的发布（中途取消会留下
# 只有部分架构的清单，或把正在写的 gha 缓存截断）。
concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 含大写（Sliverkiss/...），需转小写。
      # tag 策略：
      #   永远 commit short sha，供精确定位构建来源；
      #   非预发布（含定时/手动/稳定 tag）刷新 latest，供 NAS 滚动升级；
      #   v* tag 追加语义版本——v1.2.3 → :v1.2.3 :1.2 :1，纯数字版本才派生次/主版本，
      #   派生可能重复（v2.0 → 两个 :2），统一排序去重；预发布（v1.2.3-rc1）只落
      #   完整 tag 且不碰 latest，避免候选版顶掉稳定通道。
      - name: Compute image name & tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:${GITHUB_SHA::12}"
          prerelease=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"; bare="${ver#v}"
            tags="$tags"$'\n'"$name:$ver"
            if [[ "$bare" == *"-"* ]]; then
              prerelease=true
            elif [[ "$bare" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              tags="$tags"$'\n'"$name:${bare%.*}"$'\n'"$name:${bare%%.*}"
            fi
          fi
          [[ "$prerelease" == false ]] && tags="$tags"$'\n'"$name:latest"
          {
            echo "name=$name"
            echo "tags<<TAGS_EOF"
            sort -u <<< "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # 镜像不含真实配置：.dockerignore 排除 config.json，Dockerfile 只落
      # config.example.json 作占位，生产配置由挂载卷 /app/config.json 覆盖（见 README
      # 「配置与数据持久化」），因此构建上下文无需先生成 config.json。
      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 双架构离线包：NAS / 内网拉不到 ghcr 时，从 workflow artifact 下载本地 docker load。
  # arm64 与 amd64 并行导出（--output type=docker 只能单架构，故按 matrix 拆两份）；
  # 只读 gha 缓存加速（缓存写入归 build 任务，避免 matrix 两端互相覆盖）。
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export offline tarball (${{ matrix.arch }})
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --file Dockerfile \
            --cache-from type=gha \
            --tag wb2api:offline --output type=docker,dest=wb2api-${{ matrix.arch }}.tar .
          gzip -f wb2api-${{ matrix.arch }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-${{ matrix.arch }}
          path: wb2api-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Release：仅 v* tag 触发。用 GITHUB_TOKEN 建页面 + 挂离线包，
  # 离线包随版本绑定（artifact 本身 90 天过期，转成 Release asset 长期可用）。
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, offline]
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 拉取完整历史与 tag refs：默认 fetch-depth=1 只取最新提交，
      # git tag -l 查不到本 tag → notes 为空 → 正文前置 master 最新提交说明（v1.1.2 实证）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 下载 offline 任务的两个 tar.gz（矩阵产物名 = wb2api-<arch>），
      # 顺带校验 needs 链：构建失败则本任务不跑，不会建出空 Release。
      - name: Download offline tarballs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: wb2api-*
          glob: '*.tar.gz'

      - name: Stage assets
        run: mv release-assets/*.tar.gz . && ls -lh wb2api-*.tar.gz

      # 取 tag 注解正文（subject + body）。
      # 三条弯路（v1.1.1 / v1.1.3 / v1.2.1 实证）：
      #   head_commit.message → push tag 事件下是 master 最新提交，不是 tag 说明；
      #   git tag -l --format='%(contents:subject)' → runner 拉的 refs 只剩 commit message；
      #   printf 的 %s 遇多行参数只格式化首行。
      # → 直接调 GitHub API 读 tag 对象（type=tag 才有 tag + message），语义稳定。
      - name: Extract tag notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${GITHUB_REF#refs/tags/}" \
            > /tmp/tag.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          d = json.load(open('/tmp/tag.json'))
          # tag 对象的 message 即打 tag 时的 -m 全文（subject 与 body 以空行连接，
          # 仓库历史 tag 里 -m 的换行被 git 存为字面 \n，一并还原）。
          body = d.get('message') or ''
          body = re.sub(r'\\n', '\n', body)
          print('notes<<NOTES_EOF')
          print(body)
          print('NOTES_EOF')
          PY

      # generate_release_notes=true 会让 GitHub 用 tag 所指 commit 的提交说明
      # 自动生成正文并覆盖 body（v1.2.0 实证：正文是 commit message 而非 tag 注解）。
      # 关掉它，正文改由 tag 注解承载（打 tag 时 -m 写清行为变化）。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: wb2api-*.tar.gz
          body: |
            ${{ steps.notes.outputs.notes }}

            ---

            ## 镜像

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            多架构 manifest（linux/amd64 + linux/arm64），`docker pull` 按宿主架构自动选层。

            ## 离线部署（NAS / 内网）

            Assets 中的 `wb2api-<arch>.tar.gz` 下载后导入，compose 里 `image: wb2api:offline`：

            ```bash
            gunzip -c wb2api-arm64.tar.gz | docker load
            ```

            完整说明见 README「CI 与镜像发布」与「配置与数据持久化」两章。

